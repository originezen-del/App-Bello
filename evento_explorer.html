<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evento Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f0e8;color:#1e140a;font-size:15px}
#hdr{background:linear-gradient(160deg,#c45a1a,#7a2800);padding:14px 16px;color:#fff8f0}
h1{font-size:20px;font-weight:bold;margin-bottom:6px}
#sub{font-size:12px;color:#f0d0a8;margin-bottom:10px;min-height:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row label{font-size:13px;color:#f8d8b0;white-space:nowrap}
#pi{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.5);font-size:14px;width:220px}
#tb{background:#fff8f0;color:#7a2800;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:bold;cursor:pointer}
#rs{font-size:12px;color:#f0d0a8;min-height:16px;margin-top:2px}
.rrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rrow label{font-size:13px;color:#f8d8b0}
#sl{width:180px}
#rv{font-size:13px;font-weight:bold;color:#ffe0b0;min-width:65px}
#filt{background:#f5d9b0;border-bottom:2px solid #d4b896;padding:8px 14px;position:sticky;top:0;z-index:10}
.fr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fr input{padding:5px 9px;font-size:12px;border:1px solid #c8a060;border-radius:8px;width:120px}
.cb{padding:4px 9px;border-radius:14px;border:1px solid #c8a060;background:#fff;color:#5c3d1e;font-size:12px;cursor:pointer}
.cb.on{background:#b5451b;color:#fff;border-color:#b5451b}
select{padding:4px 7px;font-size:12px;border:1px solid #c8a060;border-radius:8px;background:#fff}
#ec{font-size:12px;color:#8a6640;margin-left:auto}
#con{padding:12px 14px;max-width:900px;margin:0 auto}
.nev{text-align:center;padding:40px 20px;color:#8a6640;font-size:14px;line-height:1.7}
.card{background:#fffdf5;border:1px solid #d4b896;border-radius:10px;margin-bottom:10px;overflow:hidden}
.ch{padding:12px 13px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;background:#fffdf5}
.ch:hover{background:#fef3e0}
.ci{flex:1}
.cn{font-size:14px;font-weight:bold;margin-bottom:2px;line-height:1.3;color:#1e140a}
.cl{font-size:12px;color:#5c3d1e;margin-bottom:2px}
.cd{font-size:12px;color:#b5451b;margin-bottom:4px}
.tgs{display:flex;flex-wrap:wrap;gap:3px}
.tg{font-size:11px;padding:1px 6px;border-radius:7px;color:#fff}
.ta{background:#e8f5e8!important;color:#1a6a1a!important}
.cm{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:68px}
.bg{font-weight:bold;font-size:12px;padding:3px 8px;border-radius:8px}
.b0{background:#d4f0d4;color:#1a6a1a}
.b1{background:#fef8d0;color:#7a5500}
.b2{background:#fde8d0;color:#8a3000}
.b3{background:#fdd8d8;color:#7a1a1a}
.ct{font-size:11px;color:#8a6640}
.det{display:none;border-top:1px solid #d4b896;padding:12px 13px;background:#fafaf5}
.det.open{display:block}
.dsc{font-size:13px;color:#5c3d1e;line-height:1.6;margin-bottom:10px}
.dbx{background:#f5ead0;border-radius:8px;padding:10px 12px;margin-bottom:10px}
.dr{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid #d4b896}
.dr:last-child{border-bottom:none}
.dk{color:#5c3d1e}.dv{font-weight:bold;color:#1e140a}
.dtot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:2px solid #d4b896;font-weight:bold;font-size:14px}
.acts{display:flex;gap:8px;margin-top:10px}
.ab{padding:8px 13px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;border:none;text-decoration:none}
.as{background:#1a4a8a;color:#fff}
.am{background:#2d7a2d;color:#fff}
</style>
</head>
<body>

<div id="hdr">
  <h1>Evento Explorer</h1>
  <div id="sub">Inserisci la citta di partenza e premi Trova eventi</div>
  <div class="row">
    <label>Partenza:</label>
    <input type="text" id="pi" placeholder="Milano, Napoli, Aosta...">
    <button id="tb" onclick="trova()">Trova eventi</button>
  </div>
  <div id="rs"></div>
  <div class="rrow">
    <label>Raggio:</label>
    <input type="range" id="sl" min="0" max="500" step="25" value="200" oninput="setR(+this.value)">
    <span id="rv">200 km</span>
  </div>
</div>

<div id="filt">
  <div class="fr">
    <input type="text" placeholder="Cerca..." oninput="S.q=this.value;render()">
    <button class="cb on" data-c="Tutti" onclick="setCat(this)">Tutti</button>
    <button class="cb" data-c="Scientifico" onclick="setCat(this)">Scienza</button>
    <button class="cb" data-c="Enogastronomia" onclick="setCat(this)">Eno</button>
    <button class="cb" data-c="Botanico" onclick="setCat(this)">Botanico</button>
    <button class="cb" data-c="Artistico" onclick="setCat(this)">Arte</button>
    <button class="cb" data-c="Natura" onclick="setCat(this)">Natura</button>
    <button class="cb" id="apb" onclick="togAp()">Aperto</button>
    <select onchange="S.sort=this.value;render()">
      <option value="dist">Per distanza</option>
      <option value="costo">Per costo</option>
    </select>
    <span id="ec"></span>
  </div>
</div>

<div id="con"></div>

<script>

var CC={"milano":[45.4654,9.1859],"torino":[45.0703,7.6869],"genova":[44.4056,8.9463],"aosta":[45.737,7.3152],"pavia":[45.1847,9.1582],"bergamo":[45.698,9.6773],"brescia":[45.5416,10.2118],"como":[45.808,9.0852],"varese":[45.8206,8.8257],"monza":[45.5837,9.2744],"cremona":[45.1333,10.0222],"lodi":[45.3142,9.5037],"mantova":[45.1564,10.7912],"lecco":[45.8556,9.398],"vigevano":[45.3184,8.8573],"piacenza":[45.0526,9.693],"venezia":[45.4404,12.316],"verona":[45.4384,10.9916],"padova":[45.4064,11.8768],"vicenza":[45.5455,11.5354],"treviso":[45.6669,12.2431],"belluno":[46.1397,12.2163],"rovigo":[45.0707,11.7891],"trento":[46.0748,11.1217],"bolzano":[46.4983,11.3548],"trieste":[45.6496,13.7768],"udine":[46.0639,13.2358],"pordenone":[45.964,12.6583],"bologna":[44.4949,11.3426],"parma":[44.8015,10.3279],"modena":[44.6471,10.9252],"ferrara":[44.8353,11.6198],"ravenna":[44.4184,12.2035],"rimini":[44.0588,12.5652],"forli":[44.2228,12.0407],"reggio emilia":[44.6989,10.6297],"firenze":[43.7696,11.2558],"siena":[43.3186,11.3307],"pisa":[43.7228,10.4017],"lucca":[43.843,10.505],"arezzo":[43.4636,11.8796],"livorno":[43.548,10.3108],"prato":[43.8777,11.102],"grosseto":[42.7636,11.1122],"ancona":[43.6158,13.5189],"perugia":[43.1107,12.3908],"terni":[42.5636,12.6425],"roma":[41.9028,12.4964],"latina":[41.4676,12.9035],"viterbo":[42.4168,12.1051],"pescara":[42.4615,14.2158],"l aquila":[42.3498,13.3997],"laquila":[42.3498,13.3997],"napoli":[40.8518,14.2681],"salerno":[40.6824,14.7681],"caserta":[41.0748,14.3325],"bari":[41.1171,16.8719],"taranto":[40.4644,17.247],"lecce":[40.3527,18.1743],"foggia":[41.4621,15.5444],"palermo":[38.1157,13.3615],"catania":[37.5079,15.083],"messina":[38.1938,15.5542],"siracusa":[37.0755,15.2866],"agrigento":[37.3111,13.5765],"enna":[37.5655,14.2819],"trapani":[38.0176,12.5136],"ragusa":[36.9274,14.7242],"cagliari":[39.2238,9.1217],"sassari":[40.7268,8.5593],"olbia":[40.9255,9.5009],"catanzaro":[38.9096,16.5878],"cosenza":[39.2984,16.2544],"potenza":[40.6396,15.8056],"matera":[40.6664,16.6043],"reggio calabria":[38.1111,15.6618],"reggiocalabria":[38.1111,15.6618],"alba":[44.7008,8.0359],"cuneo":[44.3845,7.5426],"asti":[44.9003,8.2064],"novara":[45.4455,8.6223],"alessandria":[44.9131,8.615],"la spezia":[44.1025,9.824],"laspezia":[44.1025,9.824],"savona":[44.3064,8.4819],"merano":[46.6693,11.1597],"rovereto":[45.8908,11.0413],"cinque terre":[44.1049,9.7289],"cinqueterre":[44.1049,9.7289],"abbiategrasso":[45.3975,8.9183],"busto arsizio":[45.6117,8.8515],"sondrio":[46.1697,9.8717],"campobasso":[41.5628,14.656]};

var plat=null,plon=null;
var S={raggio:200,cat:"Tutti",aperto:false,q:"",sort:"dist",exp:null};
var cP=2.054,cC=18;

function nrm(s){
  s=(s||"").trim().toLowerCase();
  var m={"a":"a","e":"e","i":"i","o":"o","u":"u"};
  for(var k in m)while(s.indexOf(k)!==-1)s=s.replace(k,m[k]);
  var o="";
  for(var i=0;i<s.length;i++){var c=s[i];o+=((c>="a"&&c<="z")||(c>="0"&&c<="9")||c===" ")?c:" ";}
  while(o.indexOf("  ")!==-1)o=o.replace("  "," ");
  return o.trim();
}

function geo(v){
  var n=nrm(v);
  if(!n)return null;
  if(CC[n])return CC[n];
  var ks=Object.keys(CC);
  if(n.length>=4)for(var i=0;i<ks.length;i++)if(ks[i].indexOf(n)===0)return CC[ks[i]];
  var p=n.split(" ")[0];
  if(p.length>=4)for(var j=0;j<ks.length;j++)if(ks[j].indexOf(p)===0)return CC[ks[j]];
  return null;
}

function hav(a,b,c,d){
  var R=6371,dl=(c-a)*Math.PI/180,dm=(d-b)*Math.PI/180;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dm/2)*Math.sin(dm/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function dEv(ev){return hav(plat,plon,ev.lat,ev.lon);}

function costi(ev){
  var km=Math.round(dEv(ev)),ar=km*2;
  var ca=km>0?parseFloat(((ar/cC)*cP).toFixed(2)):0;
  var au=parseFloat((ev.autostr*2).toFixed(2));
  return{km:km,ar:ar,ca:ca,au:au,tot:parseFloat((ca+au+ev.costoN).toFixed(2))};
}

function bi(t){return t===0?0:t<20?1:t<50?2:3;}
function bt(t){return t===0?"Gratis":"~"+Math.round(t)+" euro";}
function tg(km){if(!km)return"In loco";var h=km/90;return h<1?"~"+Math.round(h*60)+" min":"~"+h.toFixed(1)+" h";}
function tgH(ts){return ts.map(function(t){return'<span class="tg" style="background:'+(TC[t]||"#888")+'">'+(TL[t]||t)+'</span>';}).join("");}

function trova(){
  var v=document.getElementById("pi").value.trim();
  var st=document.getElementById("rs");
  if(!v){st.textContent="Scrivi prima la citta di partenza";setTimeout(function(){st.textContent="";},2000);return;}
  var c=geo(v);
  if(c){
    plat=c[0];plon=c[1];
    st.textContent="Trovata: "+v;setTimeout(function(){st.textContent="";},2500);
  } else {
    st.textContent=v+" non trovata. Prova col capoluogo di provincia.";
    setTimeout(function(){st.textContent="";},3000);return;
  }
  S.exp=null;render();
}

function setR(v){
  S.raggio=v;
  document.getElementById("rv").textContent=v===0?"In loco":v+" km";
  if(plat!==null)render();
}

function getF(){
  if(plat===null)return[];
  return EV.filter(function(ev){
    var d=dEv(ev);
    if(S.raggio===0){if(d>1)return false;}else if(d>S.raggio)return false;
    if(S.cat!=="Tutti"&&ev.cat!==S.cat)return false;
    if(S.aperto&&!ev.aperto)return false;
    if(S.q){var q=S.q.toLowerCase();if(ev.nome.toLowerCase().indexOf(q)===-1&&ev.luogo.toLowerCase().indexOf(q)===-1)return false;}
    return true;
  }).sort(function(a,b){return S.sort==="costo"?costi(a).tot-costi(b).tot:dEv(a)-dEv(b);});
}

function render(){
  if(plat===null)return;
  var evs=getF();
  var citta=document.getElementById("pi").value.trim();
  document.getElementById("sub").textContent=evs.length+" eventi entro "+S.raggio+" km da "+citta;
  document.getElementById("ec").textContent=evs.length+" eventi";
  var con=document.getElementById("con");con.innerHTML="";
  if(!evs.length){
    con.innerHTML='<div class="nev">Nessun evento entro '+S.raggio+' km da '+citta+'.<br>Gli eventi del database sono nel Nord Italia.<br>Prova ad allargare il raggio o a cambiare citta.</div>';
    return;
  }
  evs.forEach(function(ev){con.appendChild(mkCard(ev));});
}

function mkCard(ev){
  var co=costi(ev),i=bi(co.tot),t=bt(co.tot),open=S.exp===ev.id;
  var d=document.createElement("div");d.className="card";
  d.innerHTML='<div class="ch" onclick="togE('+ev.id+')">'
    +'<div class="ci"><div class="cn">'+ev.nome+'</div>'
    +'<div class="cl">'+ev.luogo+'</div>'
    +'<div class="cd">'+ev.data+'</div>'
    +'<div class="tgs">'+tgH(ev.tags)+(ev.aperto?'<span class="tg ta">Aperto</span>':'')+'</div></div>'
    +'<div class="cm"><span class="bg b'+i+'">'+t+'</span>'
    +'<span class="ct">'+tg(co.km)+'</span>'
    +'<span class="ct">'+(open?"&#9650;":"&#9660;")+'</span></div></div>'
    +'<div class="det'+(open?" open":"")+'" id="d'+ev.id+'">'+detH(ev,co)+'</div>';
  return d;
}

function detH(ev,co){
  var i=bi(co.tot),t=bt(co.tot),fc=["#1a6a1a","#4a7a10","#8a5000","#7a1a1a"][i];
  var orig=encodeURIComponent(document.getElementById("pi").value.trim());
  var dest=encodeURIComponent(ev.mappa);
  var mu="https://www.google.com/maps/dir/?api=1&origin="+orig+"&destination="+dest+"&travelmode=driving";
  var rows=[["Distanza A/R",co.km>0?co.ar+" km":"In loco"],["Tempo guida",tg(co.km)],["Carburante A/R",co.km>0?co.ca.toFixed(2)+" euro":"--"],["Autostrada A/R",co.au>0?co.au.toFixed(2)+" euro":"--"],["Biglietto",ev.costoEv]];
  return'<div class="dsc">'+ev.desc+'</div>'
    +'<div class="dbx">'+rows.map(function(r){return'<div class="dr"><span class="dk">'+r[0]+'</span><span class="dv">'+r[1]+'</span></div>';}).join("")
    +'<div class="dtot"><span>Totale stimato</span><span style="color:'+fc+'">'+t+'</span></div>'
    +'<div style="font-size:11px;color:#8a6640;margin-top:4px">Esclusi parcheggio e pasti</div></div>'
    +'<div class="acts"><a class="ab as" href="'+ev.url+'" target="_blank" rel="noopener noreferrer">Sito ufficiale</a>'
    +'<a class="ab am" href="'+mu+'" target="_blank" rel="noopener noreferrer">Indicazioni Google Maps</a></div>';
}

function togE(id){S.exp=S.exp===id?null:id;render();setTimeout(function(){var el=document.getElementById("d"+id);if(el&&S.exp===id)el.scrollIntoView({behavior:"smooth",block:"nearest"});},50);}
function setCat(btn){document.querySelectorAll(".cb[data-c]").forEach(function(b){b.classList.remove("on");});btn.classList.add("on");S.cat=btn.dataset.c;render();}
function togAp(){S.aperto=!S.aperto;document.getElementById("apb").classList.toggle("on",S.aperto);render();}

document.getElementById("pi").addEventListener("keydown",function(e){if(e.key==="Enter")trova();});
</script>
